name: BUARO climate projections

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "buaro/hazard.py"
      - ".github/workflows/climate.yml"

permissions:
  contents: write

concurrency:
  group: buaro-climate
  cancel-in-progress: false

jobs:
  climate:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Copernicus climate projections
        env:
          CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}
        run: python -m buaro.hazard

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898237+github-actions[bot]@users.noreply.github.com"
          git add data/climate
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit --allow-empty-message -m ""
            pushed=0
            for attempt in 1 2 3 4 5 6; do
              if git pull --rebase && git push; then pushed=1; break; fi
              sleep $((attempt * 15))
            done
            test "$pushed" = 1
          fi
