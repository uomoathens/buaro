name: BUARO static data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "buaro/static_fetch.py"
      - ".github/workflows/static-data.yml"

permissions:
  contents: write

concurrency:
  group: buaro-static
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Fetch static layers
        env:
          CLMS_SERVICE_KEY: ${{ secrets.CLMS_SERVICE_KEY }}
        run: python -m buaro.static_fetch

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898237+github-actions[bot]@users.noreply.github.com"
          git add data/static
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit --allow-empty-message -m ""
            git pull --rebase
            git push
          fi
