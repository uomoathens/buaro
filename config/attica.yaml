reference:
  label: ISGlobal (Janoš et al. 2025, Nature Medicine), Greece, summer 2024
  greece_heat_deaths_2024: 5980
  greece_population_2021: 10482487
  attica_population_2021: 3814064
  note: Order-of-magnitude cross-check only. ISGlobal uses daily data and a different model; in a comparison across 147 European regions, weekly data underestimated heat-related mortality by 21.6% compared with daily data, and for summer 2022 across Europe the same authors put the gap at about 10%, within 6% to 21% (Ballester et al. 2023, The Lancet Regional Health Europe).
