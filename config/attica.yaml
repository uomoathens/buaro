study:
  name: Attica
  country: EL
  nuts2: EL30
  start_year: 2015
  pandemic_exclusion:
    start: 2020-W10
    end: 2022-W26
  backtest_years: [2023, 2024, 2025]
  summer_weeks: [23, 39]
  threshold_percentiles: [60, 65, 70, 75, 80, 85, 90]
  fourier_harmonics: 3
  min_training_weeks: 150
  euromomo:
    stable_weeks: [[16, 25], [37, 44]]
    model_weeks: [16, 44]
    harmonics: 1

